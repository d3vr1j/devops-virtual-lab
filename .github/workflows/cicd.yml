name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4        # CHANGED: v3 is deprecated

      - name: Build Docker Image
        run: docker build -t devops-lab-app:latest ./app

      - name: Create Kubernetes cluster  # ADDED: runner has no cluster by default
        uses: helm/kind-action@v1
        with:
          cluster_name: devops-lab

      - name: Load image into cluster    # ADDED: make local image visible to Kubernetes
        run: kind load docker-image devops-lab-app:latest --name devops-lab

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Verify deployment          # ADDED: fail the pipeline if pods don't come up
        run: |
          kubectl rollout status deployment/devops-app --timeout=120s
          kubectl get pods -o wide
          kubectl get svc
