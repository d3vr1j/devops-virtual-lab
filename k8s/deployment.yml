apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops
  template:
    metadata:
      labels:            # CHANGED: PDF had "labels: app: devops" on one line (invalid)
        app: devops
    spec:
      containers:
        - name: devops-container
          image: devops-lab-app:latest
          imagePullPolicy: IfNotPresent   # ADDED: use local image, don't pull from Docker Hub
          ports:
            - containerPort: 80
